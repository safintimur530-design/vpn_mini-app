<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>Mountain VPN</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="top">
        <div>
            <div class="brand">MOUNTAIN VPN</div>
            <div class="subtitle">Private connection</div>
        </div>

        <button class="profile-btn" id="profileButton">
            👤
        </button>
    </header>


    <main>

        <section class="connection-card">

            <div class="status-label">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">VPN отключён</span>
            </div>

            <div class="connection-icon">
                🔒
            </div>

            <h1 id="connectionTitle">
                Защищённое соединение
            </h1>

            <p id="connectionDescription">
                Подключитесь к VPN<br>
                для безопасного доступа в интернет
            </p>

            <button class="connect-btn" id="connectButton">
                <span id="connectText">ПОДКЛЮЧИТЬ</span>
            </button>

        </section>


        <section class="info-grid">

            <button class="menu-card" id="plansButton">
                <div class="card-icon">💳</div>

                <div>
                    <strong>Подписка</strong>
                    <span>Выбрать тариф</span>
                </div>
            </button>


            <button class="menu-card" id="referralsButton">
                <div class="card-icon">👥</div>

                <div>
                    <strong>Рефералы</strong>
                    <span>Пригласить друзей</span>
                </div>
            </button>


            <button class="menu-card" id="devicesButton">
                <div class="card-icon">📱</div>

                <div>
                    <strong>Устройства</strong>
                    <span>Мои подключения</span>
                </div>
            </button>


            <button class="menu-card" id="profileCardButton">
                <div class="card-icon">👤</div>

                <div>
                    <strong>Профиль</strong>
                    <span>Мой аккаунт</span>
                </div>
            </button>

        </section>

    </main>


    <footer>
        <span>🏔️ MOUNTAIN VPN</span>
        <span>Secure connection</span>
    </footer>

</div>


<script src="app.js"></script>

</body>
</html>
