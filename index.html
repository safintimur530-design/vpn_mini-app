<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VPN Service</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://telegram.org/js/telegram-web-app.js"
    ></script>
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <div class="logo">VPN</div>
            <div class="subtitle">Secure connection</div>
        </div>

        <button class="profile-button" onclick="openProfile()">
            👤
        </button>
    </header>


    <main>

        <section class="status-card">

            <div class="status-circle">
                <div class="power">⏻</div>
            </div>

            <div class="status-title">
                VPN отключён
            </div>

            <div class="status-subtitle">
                Нажми, чтобы подключиться
            </div>

            <button
                class="connect-button"
                onclick="connectVPN()"
            >
                ПОДКЛЮЧИТЬ
            </button>

        </section>


        <section class="info-card">

            <div class="info-item">
                <span>Подписка</span>
                <strong id="subscription">
                    Не активна
                </strong>
            </div>

            <div class="info-item">
                <span>Сервер</span>
                <strong id="server">
                    Авто
                </strong>
            </div>

            <div class="info-item">
                <span>Устройства</span>
                <strong id="devices">
                    0 / 3
                </strong>
            </div>

        </section>


        <h2>Быстрый доступ</h2>

        <div class="menu-grid">

            <button onclick="openPlans()">
                <span>💳</span>
                <small>Подписка</small>
            </button>

            <button onclick="openDevices()">
                <span>📱</span>
                <small>Устройства</small>
            </button>

            <button onclick="openReferrals()">
                <span>🎁</span>
                <small>Рефералы</small>
            </button>

            <button onclick="openPromo()">
                <span>🎟</span>
                <small>Промокод</small>
            </button>

        </div>


        <section class="ref-card">

            <div class="ref-icon">
                🎁
            </div>

            <div class="ref-content">

                <strong>
                    Приглашай друзей
                </strong>

                <p>
                    За каждого приглашённого
                    получаешь +2% скидки
                </p>

                <div class="discount">
                    Твоя скидка: <b id="discount">0%</b>
                </div>

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button class="active">
            <span>🏠</span>
            Главная
        </button>

        <button onclick="openPlans()">
            <span>💳</span>
            Тарифы
        </button>

        <button onclick="openProfile()">
            <span>👤</span>
            Профиль
        </button>

    </nav>

</div>


<script src="app.js"></script>

</body>
</html>
